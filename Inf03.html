<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styl.css">
    <title>Inf.03</title>
</head>
<body>
    <header>
        <h1>Efekty obrazu</h1>
    </header>

    <div class="bee">
        <img src="pszczola.jpg" alt="pszczoła na fioletowym kwiatku">
        <br>
        <label><input type="radio" name="radio"> Blur</label>
        <br>
        <label><input type="radio" name="radio"> Sepia</label>
        <br>
        <label><input type="radio" name="radio"> Negatyw</label>
        <br>
        <button>Zastosuj</button>
    </div>

    <div class="orang">
        <img src="pomarancza.jpg" alt="drzewo pomarańczy">
        <br>
        <button>Kolorowy</button>
        <button>Czarno-biały</button>
    </div>

    <div class="frut">
        <img src="owoce.jpg" alt="Kosz pełen owoców">
        <br>
        <input type="range" min="0" max="100" value="100">
        <br>
        <button>Zastosuj</button>
    </div>

    <div class="tutel">
        <img src="zolw.jpg" alt="Żółw w wodzie">
        <br>
        <input type="range" min="0" max="250">
        <br>
        <button>Zastosuj</button>
    </div>

    <footer>
        <p><a href="http://www.css.com/" target="_blank">Zobacz inne efekty obrazu</a></p>
        <p>Stronę wykonał Mikołaj Niemir</p>
    </footer>
</body>
</html>
